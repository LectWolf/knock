[package]
name = "knock"
version = "0.1.0"
edition = "2021"
publish = false
description = "Knock 隧道核心：连接状态机、Transport 接口、iroh 数据通路"

[lib]
name = "knock"
path = "src/lib.rs"

# 只开需要的 iroh feature：tls-ring（TLS 后端）与 portmapper（UPnP/NAT-PMP）。
# 刻意不开 metrics；也绝不使用 n0 的默认中继（ADR-0003：节点由用户自托管）。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：桌面端要常驻托盘，关窗口默认缩进去（门继续开着）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
# 只为了拿 RelayQuicConfig：告诉中继"地址发现跟你同端口"，节点就少开一个 UDP。
iroh-relay = { version = "1.4.1", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
attohttpc = "0.30"
sha2 = "0.10"

[dev-dependencies]
# 只给测试用：unstable-net-report 能把 QAD（QUIC 地址发现）的结果读出来，
# 用来验证「节点只开一个端口也能帮打洞」。
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring", "portmapper", "unstable-net-report"] }
